name: Radar daily run

# Manual only. The daily run now happens inside the API (ops.radar_schedule, at
# RADAR_DAILY_UTC, 05:00 by default), so the database credentials never have to
# be stored in this public repository. Use this only to run the Radar from GitHub
# by hand, after adding repository secrets MONGO_URL and DB_NAME (the same values
# as the API), plus any of GROQ_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY,
# CRUSTDATA_API_KEY, and SMTP_* or RESEND_API_KEY with EMAIL_FROM for digests.
# Logs print counts only: this repository's logs are public.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "daily, collect, enrich, score, research or digest"
        default: daily
        required: false

permissions:
  contents: read

concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run the Radar
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: not-used-by-the-runner
          ADMIN_EMAIL: runner@example.com
          ADMIN_PASSWORD: not-used-by-the-runner
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CRUSTDATA_API_KEY: ${{ secrets.CRUSTDATA_API_KEY }}
          # Radar free data sources (docs/radar-free-sources.md); any that are set are used.
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          PDL_API_KEY: ${{ secrets.PDL_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$MONGO_URL" ]; then
            echo "::warning::The MONGO_URL and DB_NAME repository secrets aren't set yet, so there's nothing to run. See docs/GO-LIVE.md step 3."
            exit 0
          fi
          python radar_run.py "${{ github.event.inputs.steps || 'daily' }}"
