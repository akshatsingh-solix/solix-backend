# Production stack for one VM (Oracle Always Free ARM, or any small VPS): API + MongoDB + HTTPS.
#   docker compose up -d --build
# Needs .env next to this file (copy .env.example, fill it in). See docs/MIGRATION.md.
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    # No "ports:" on purpose: the database is reachable only from the API container.
    # To browse it from your laptop use an SSH tunnel (docs/MIGRATION.md, step 11).
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      KEEP_AWAKE: "0"          # always-on host: no self-ping needed
      MONGO_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8000"
    mem_limit: 2g              # a runaway Radar run restarts the API, not the whole VM
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # keeps the HTTPS certificate across restarts
      - caddy_config:/config

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
