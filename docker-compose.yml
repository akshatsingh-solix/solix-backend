# Production stack for a single VM (Oracle Always Free, or any small VPS).
#   docker compose up -d --build
# Needs: .env (copy of .env.example, filled in) and API_DOMAIN in the same file,
# e.g. API_DOMAIN=solix-api.duckdns.org
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8000"
      KEEP_AWAKE: "0"          # always-on host: no self-ping needed
    expose:
      - "8000"
    mem_limit: 2g              # a runaway Radar run restarts the API, not the whole VM
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # keeps the HTTPS certificate across restarts
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
