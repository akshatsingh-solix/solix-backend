services:
  - type: web
    name: solix-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: solix
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://akshatsingh-solix.github.io
      - key: OPENAI_API_KEY
        sync: false
      # Optional: a GitHub token (repo scope, or fine-grained with Actions: write
      # on the Website repo) lets publishing trigger an instant static rebuild.
      - key: GITHUB_DEPLOY_TOKEN
        sync: false
