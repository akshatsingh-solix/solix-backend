services:
  - type: web
    name: solix-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: solix
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://akshatsingh-solix.github.io
      # Sol, the AI concierge: set at least one key. Providers are tried in
      # SOL_PROVIDER_ORDER and Sol fails over when one is rate limited.
      # GROQ_API_KEY alone is enough. See README "Sol".
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SOL_PROVIDER_ORDER
        value: gemini,groq,mistral,openrouter,openai,custom
      - key: OPENAI_API_KEY
        sync: false
      # Free models for Sol (CHAT_MODELS) and the SEO AI answer check (OPENROUTER_MODELS).
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHAT_MODELS
        value: google/gemma-4-31b-it:free,thinkingmachines/inkling-small:free,nvidia/nemotron-3.5-lightning:free,openrouter/free
      - key: OPENROUTER_MODELS
        value: nvidia/nemotron-3.5-lightning:free
      - key: SEMRUSH_API_KEY
        sync: false
      # Optional: news story clusters (free key, required from cloud servers)
      # and expert-coverage deep dives ($5 free Parallel credits a month).
      - key: NEWSMCP_API_KEY
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
      # Optional: a GitHub token (repo scope, or fine-grained with Actions: write
      # on the Website repo) lets publishing trigger an instant static rebuild.
      - key: GITHUB_DEPLOY_TOKEN
        sync: false
      # Public addresses put into emails (download links, "read the full article").
      # This service's own address (solix-backend.onrender.com belongs to no service):
      # download and unsubscribe links in emails, and the Instantly webhook, use it.
      - key: PUBLIC_API_URL
        value: https://solix-backend-mf5w.onrender.com
      - key: SITE_URL
        value: https://akshatsingh-solix.github.io/Website
      # Sol's knowledge of the site, published by every website deploy. The
      # copy committed here is the fallback when the site cannot be reached.
      - key: SITE_KNOWLEDGE_URL
        value: https://akshatsingh-solix.github.io/Website/sol_knowledge.json
      # Email transport for lead alerts and gated asset emails: set the SMTP_*
      # values (any provider) or RESEND_API_KEY, plus EMAIL_FROM.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Radar + EchoLocate (optional). See .env.example.
      # Leave unset until launch sign-off: SMTP and Instantly sends are held.
      - key: OUTBOUND_LIVE_SENDING
        sync: false
      # Only these AI providers see prospect personal data (default openai).
      - key: LLM_PII_PROVIDERS
        value: openai
      - key: CRUSTDATA_API_KEY
        sync: false
      - key: INSTANTLY_API_KEY
        sync: false
      - key: INSTANTLY_WEBHOOK_SECRET
        generateValue: true
      - key: REACHER_URL
        sync: false
      # Radar web research and page reading (1,000 free credits a month); Parallel is the backup.
      - key: FIRECRAWL_API_KEY
        sync: false
      # Optional: business emails and decision makers for Radar accounts (25 free searches a month).
      - key: HUNTER_API_KEY
        sync: false
      # Radar free data sources, all optional: each function fails over across the ones set,
      # paced to each free allowance. Sign-up links: docs/radar-free-sources.md.
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: GOOGLE_CSE_KEY
        sync: false
      - key: GOOGLE_CSE_CX
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SEARXNG_URL
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: THEIRSTACK_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: REED_API_KEY
        sync: false
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_EMAIL
        sync: false
      - key: COMPANIES_HOUSE_API_KEY
        sync: false
      - key: PDL_API_KEY
        sync: false
      - key: TOMBA_KEY
        sync: false
      - key: TOMBA_SECRET
        sync: false
      - key: SNOV_CLIENT_ID
        sync: false
      - key: SNOV_CLIENT_SECRET
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: PROSPEO_API_KEY
        sync: false
      - key: SKRAPP_API_KEY
        sync: false
      - key: MAILBOXVALIDATOR_API_KEY
        sync: false
      - key: ZEROBOUNCE_API_KEY
        sync: false
      - key: ABSTRACT_EMAIL_API_KEY
        sync: false
      - key: IPAPI_IS_KEY
        sync: false
      - key: IPINFO_TOKEN
        sync: false
      - key: IPREGISTRY_KEY
        sync: false
      - key: URLSCAN_API_KEY
        sync: false
      - key: OTX_API_KEY
        sync: false
      - key: CERTSPOTTER_API_KEY
        sync: false
      - key: SAM_GOV_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: GITHUB_MODELS_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: DIGIPRISE_URL
        sync: false
      - key: DIGIPRISE_TOKEN
        sync: false
      - key: OPS_TOKEN
        generateValue: true
      # Signs unsubscribe links; its own value so rotating JWT_SECRET never breaks them.
      - key: UNSUBSCRIBE_SECRET
        generateValue: true
