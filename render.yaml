services:
  - type: web
    name: solix-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: solix
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://akshatsingh-solix.github.io
      - key: OPENAI_API_KEY
        sync: false
      # Free alternative for the chat concierge and the SEO AI answer check.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHAT_MODELS
        value: google/gemma-4-31b-it:free,thinkingmachines/inkling-small:free,nvidia/nemotron-3.5-lightning:free,openrouter/free
      - key: OPENROUTER_MODELS
        value: nvidia/nemotron-3.5-lightning:free
      - key: SEMRUSH_API_KEY
        sync: false
      # Optional: a GitHub token (repo scope, or fine-grained with Actions: write
      # on the Website repo) lets publishing trigger an instant static rebuild.
      - key: GITHUB_DEPLOY_TOKEN
        sync: false
      # Public addresses put into emails (download links, "read the full article").
      - key: PUBLIC_API_URL
        value: https://solix-backend.onrender.com
      - key: SITE_URL
        value: https://akshatsingh-solix.github.io/Website
      # Email transport for lead alerts and gated asset emails: set the SMTP_*
      # values (any provider) or RESEND_API_KEY, plus EMAIL_FROM.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
